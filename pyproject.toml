[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lht"
version = "2.1.1"
description = "Bring Your Own Data Warehouse: open-source Salesforce to Snowflake sync and reverse ETL using the Salesforce Bulk API 2.0."
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Dan Kauppi", email = "dan@lakehousetools.com" },
]
requires-python = ">=3.9"
keywords = [
  "salesforce",
  "snowflake",
  "salesforce-to-snowflake",
  "salesforce snowflake integration",
  "bulk-api",
  "bulk api 2.0",
  "reverse-etl",
  "etl",
  "elt",
  "data-pipeline",
  "data-warehouse",
  "lakehouse",
  "snowpark",
  "crm",
  "fivetran-alternative",
  "airbyte-alternative",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "pandas>=2.2.3",
  "snowflake-snowpark-python[pandas]>=1.31.1",
  "requests>=2.32.3",
  "cryptography>=3.0.0",
  "tabulate>=0.9.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build", "twine"]

[project.scripts]
lht = "lht.cli:main"

[project.urls]
Homepage = "https://github.com/lakehousetools/lht"
Documentation = "https://lakehousetools.github.io/lht/"
Source = "https://github.com/lakehousetools/lht"
Issues = "https://github.com/lakehousetools/lht/issues"
Changelog = "https://github.com/lakehousetools/lht/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live test against a real Salesforce org and Snowflake warehouse; requires a configured connection and network access. Excluded by default -- run explicitly with `pytest -m integration`.",
]
addopts = "-m 'not integration'"

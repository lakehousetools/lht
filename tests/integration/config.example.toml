# Configuration for the integration test suite.
# Copy to config.toml (gitignored) and edit for your own org and warehouse:
#   cp config.example.toml config.toml
# `org` must match a connection name already created via `lht create-connection --salesforce`.

[salesforce]
org = "my_salesforce_sandbox"

[snowflake]
database = "LHT_TEST"
# Pin the Snowflake connection by name if you have more than one saved;
# otherwise lht falls back to your primary connection.
connection = "my_snowflake"
# schema = "INT"  # uncomment to override; otherwise uses the connection's default schema

[sync]
sobject = "Account"
